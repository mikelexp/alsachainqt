[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alsachainqt"
version = "0.1.0-beta.1"
description = "Native Qt desktop manager for ALSAChain virtual PCM profiles"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]
build = ["nuitka>=2.5"]

[project.scripts]
alsachainqt = "alsachainqt.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
